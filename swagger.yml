openapi: 3.0.0
info:
  title: "ATP DB"
  description: "An API ATP Player Data"
  version: "1.0.0"
servers:
  - url: "/api"
components:
  schemas:
    PlayerBase:
      type: "object"
      required:
        - fname
        - lname
        - birth_date
        - country
        - dominant_hand
        - backhand
      properties:
        fname:
          type: "string"
        lname:
          type: "string"
        birth_date:
          type: "string"
          nullable: true
        country:
          type: "string"
          nullable: true
        dominant_hand:
          type: "string"
          enum: ["right", "left"]
          nullable: true
        backhand:
          type: "integer"
          enum: [1, 2]
          nullable: true
    Player:
      allOf:
        - $ref: "#/components/schemas/PlayerBase"
        - type: "object"
          required:
            - timestamp
          properties:
            timestamp:
              type: "string"
    PlayerPost:
      allOf:
        - $ref: "#/components/schemas/PlayerBase"
        - type: "object"
    PlayerUpdate:
      type: "object"
      properties:
        fname:
          type: "string"
        lname:
          type: "string"
        birth_date:
          type: "string"
          nullable: true
        country:
          type: "string"
          nullable: true
        dominant_hand:
          type: "string"
          enum: ["right", "left"]
          nullable: true
        backhand:
          type: "integer"
          enum: [1, 2]
          nullable: true
  parameters:
    lname:
      name: "lname"
      description: "Last name of the player to get"
      in: path
      required: True
      schema:
        type: "string"
paths:
  /players:
    get:
      operationId: "players.read_all"
      tags:
        - Players
      summary: "Read the list of players"
      responses:
        "200":
          description: "Successfully read players list"
    post:
      operationId: "players.add"
      tags:
        - Players
      summary: "Add a player"
      requestBody:
        description: "Player to add"
        required: True
        content:
          application/json:
            schema:
              x-body-name: "player"
              $ref: "#/components/schemas/PlayerPost"
      responses:
        "201":
          description: "Successfully added player"
  /players/{lname}:
    get:
      operationId: "players.read_one"
      tags:
        - Players
      summary: "Read a player"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Successfully read player"
    put:
      operationId: "players.update_one"
      tags:
        - Players
      summary: "Update a player"
      parameters:
        - $ref: "#/components/parameters/lname"
      responses:
        "200":
          description: "Successfully updated player"
      requestBody:
        description: "Player to update"
        required: True
        content:
          application/json:
            schema:
              x-body-name: "player_update"
              $ref: "#/components/schemas/PlayerUpdate"
    delete:
       operationId: "players.delete_one"
       tags:
         - Players
       summary: "Delete a player"
       parameters:
         - $ref: "#/components/parameters/lname"
       responses:
         "204":
           description: "Successfully deleted player"
